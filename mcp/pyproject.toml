# SPDX-License-Identifier: MIT

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "litbench-mcp"
version = "0.1.0"
description = "LitBench 只读 MCP 出口（MIT 薄层，只通过 HTTP 调 LitBench API）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LitBench contributors" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
# 许可边界：本包是 MIT 薄层，**不 import** 主仓 AGPL 服务端代码，只经 HTTP 调 REST API。
# mcp 是官方 MCP Python SDK（MIT）；httpx 只用于调 LitBench API。
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
litbench-mcp = "litbench_mcp.__main__:main"

[project.urls]
Documentation = "https://github.com/AmosLu1129/LitBench/tree/main/mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/litbench_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
