# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试（pytest，SQLite，无外部服务）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest pytest-asyncio httpx aiosqlite

      # M8 的真实渲染测试依赖 pandoc 3.14 / typst 0.15.1；缓存 .data/tools 避免每次重下。
      # 中文字形由 fonts-noto-cjk 提供（与 Dockerfile 一致），PDF 文本断言才稳定。
      - name: 缓存导出工具（pandoc / typst）
        uses: actions/cache@v4
        with:
          path: .data/tools
          key: litbench-tools-pandoc-3.14-typst-0.15.1

      - name: 安装导出工具（pandoc / typst + Noto CJK）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python scripts/get_pandoc.py
          python scripts/get_typst.py
          "$(find .data/tools/pandoc -name pandoc -type f | head -n1)" --version | head -n1
          "$(find .data/tools/typst -name typst -type f | head -n1)" --version

      - name: pytest
        working-directory: server
        run: python -m pytest -q

  mcp:
    name: M4 MCP 薄层（pytest，MockTransport 假 API）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e "mcp[dev]"

      - name: pytest
        run: python -m pytest mcp/tests -q

  docs:
    name: 文档计数一致性（当前基线锚点）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只做 pytest --collect-only（不执行测试），所以不需要 pandoc/typst；
      # 装两份依赖是为了让收集阶段能 import 到 server / mcp 的测试模块。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest pytest-asyncio httpx aiosqlite
          pip install -e "mcp[dev]"

      - name: 校验文档当前基线计数
        run: python scripts/check_doc_counts.py

  web:
    name: 前端构建（tsc --noEmit + vite build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci --prefix web

      - name: 构建
        run: npm run build --prefix web
