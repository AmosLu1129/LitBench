# SPDX-License-Identifier: AGPL-3.0-or-later
name: license

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-deps:
    name: Python 依赖许可证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pip-licenses

      - name: 导出许可证清单
        run: pip-licenses --format=csv --with-license-file --output-file /tmp/licenses.csv

      - name: 检查（禁止 AGPL / GPL / SSPL / RSAL 进入主镜像）
        run: python scripts/check_licenses.py /tmp/licenses.csv

  node-deps:
    name: 前端依赖许可证
    runs-on: ubuntu-latest
    # 注意：hashFiles() 只能在 step 级 if 使用；这里不再做 job 级条件，
    # 直接把 check 放到安装之后（package-lock.json 已提交，npm ci 必然可跑）。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm ci --prefix web

      - name: 检查
        run: npx --yes license-checker --prefix web --production --failOn "AGPL;GPL;SSPL;RSAL;Commons Clause"

  spdx:
    name: SPDX 头检查
    runs-on: ubuntu-latest
    # TODO: 源码落地后去掉 continue-on-error，改为强制
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reuse
      - run: reuse lint
