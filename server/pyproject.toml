# SPDX-License-Identifier: AGPL-3.0-or-later

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "litbench-server"
version = "0.0.1"
description = "LitBench 文献证据工作台 — 服务端"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "LitBench contributors" }]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

# 权威依赖清单在 requirements.txt；这里只列直接依赖，供打包使用。
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "python-multipart>=0.0.9",
  "pypdfium2>=4.30",
  "pypdf>=4.2",
  "Pillow>=10.0",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Documentation = "https://github.com/AmosLu1129/LitBench/tree/main/docs"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
