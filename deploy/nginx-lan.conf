#
# 局域网 HTTPS 入口（docker compose --profile lan up -d）
#
# 只做 TLS 终止 + 反代到 web 容器；/api 仍由 web 的 nginx 转发到 api。
# 证书：.data/certs/server.crt / server.key（自签测试用 scripts/gen_selfsigned_cert.sh，
# 正式环境换成内部 CA / Let's Encrypt）。用 HTTPS 时 .env 里 AUTH_COOKIE_SECURE=true。

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:litbench_lan:10m;
    ssl_session_timeout 1h;

    # PDF 上传大文件；解析/摘要接口可能跑很久，别让代理提前断
    client_max_body_size 300m;

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
